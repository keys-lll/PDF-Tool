name: Windows portable build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label used in the Windows zip filename"
        required: true
        default: "1.1.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Generate samples and run tests
        shell: pwsh
        run: |
          python tests/make_samples.py
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build portable Windows bundle
        shell: pwsh
        run: |
          ./windows/build.ps1 -Version "${{ inputs.version }}"

      - name: Verify bundled PDFium and smoke-test executable
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "dist\PDF-Page-Merger" -Recurse -Filter "pdfium.dll" -ErrorAction SilentlyContinue
          if (-not $dll) { throw "pdfium.dll was not bundled" }
          $exe = Resolve-Path "dist\PDF-Page-Merger\PDF-Page-Merger.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "Packaged application smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged application smoke test failed with exit code $($process.ExitCode)"
          }
          Write-Host "Packaged application smoke test passed."

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Page-Merger-${{ inputs.version }}-windows-x64
          path: dist/PDF-Page-Merger-${{ inputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
